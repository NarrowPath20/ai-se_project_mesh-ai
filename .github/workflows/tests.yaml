name: MeshAI Part 2 checks

defaults:
  run:
    working-directory: ./server

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  test:
    # MongoDB 8.0 rejects the newer Azure kernel on Ubuntu 24.04 runners.
    # Temporary workaround: https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    env:
      MONGO_URI: mongodb://127.0.0.1:27017/meshai_ci
      JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - name: Start MongoDB
        run: |
          docker run --detach --name meshai-mongodb --publish 127.0.0.1:27017:27017 mongo:8.0
          for attempt in $(seq 1 30); do
            if [ "$(docker inspect --format '{{.State.Running}}' meshai-mongodb)" != "true" ]; then
              echo "::error::MongoDB container exited during startup"
              docker inspect --format '{{json .State}}' meshai-mongodb
              docker logs meshai-mongodb
              exit 1
            fi
            if docker exec meshai-mongodb mongosh --quiet --eval 'quit(db.runCommand({ ping: 1 }).ok === 1 ? 0 : 1)'; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB did not become ready within 60 seconds"
          docker inspect --format '{{json .State}}' meshai-mongodb
          docker logs meshai-mongodb
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Run Postman core collection
        run: |
          npm start > /tmp/mesh-ai-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/health; then break; fi
            sleep 1
          done
          npx --yes newman run postman/mesh-ai.postman_collection.json --folder Core
      - name: MongoDB diagnostics
        if: failure()
        run: |
          docker ps --all
          docker inspect --format '{{json .State}}' meshai-mongodb
          docker logs meshai-mongodb
      - name: Stop MongoDB
        if: always()
        run: docker rm --force meshai-mongodb
